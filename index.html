async function otworz(h){const m=await crypto.subtle.importKey("raw",new TextEncoder().encode(h),"PBKDF2",false,["deriveKey"]);
 const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:IT,hash:"SHA-256"},m,{name:"AES-GCM",length:256},false,["decrypt"]);
 const p=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.i)},k,u(D.c));return new TextDecoder().decode(p)}
